services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: great-ui-app
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: always

  caddy:
    image: caddy:latest
    container_name: great-ui-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
